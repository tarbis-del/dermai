<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DermAI — Skin Disease Detector</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #2a210d 0%,
                    #0b0b0b 45%,
                    #050505 100%
                );

            color: #f5f0df;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }

        .container {

            width: 100%;

            max-width: 700px;

            background:
                rgba(
                    18,
                    18,
                    18,
                    0.96
                );

            border:
                1px solid
                rgba(
                    212,
                    175,
                    55,
                    0.35
                );

            border-radius: 24px;

            padding: 45px;

            text-align: center;

            box-shadow:
                0 0 50px
                rgba(
                    212,
                    175,
                    55,
                    0.12
                );
        }

        .logo {

            color: #d4af37;

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 15px;

            text-transform: uppercase;
        }

        h1 {

            font-size: 42px;

            margin-bottom: 12px;

            background:
                linear-gradient(
                    90deg,
                    #f7e7a5,
                    #d4af37,
                    #fff1a8
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color:
                transparent;
        }

        .subtitle {

            color: #aaa;

            line-height: 1.6;

            margin-bottom: 35px;
        }

        .upload-box {

            border:
                2px dashed
                rgba(
                    212,
                    175,
                    55,
                    0.55
                );

            border-radius: 18px;

            padding: 40px 20px;

            cursor: pointer;

            transition:
                0.25s ease;

            margin-bottom: 20px;
        }

        .upload-box:hover {

            border-color:
                #d4af37;

            background:
                rgba(
                    212,
                    175,
                    55,
                    0.05
                );
        }

        .upload-icon {

            font-size: 45px;

            margin-bottom: 15px;
        }

        .upload-text {

            color: #ddd;

            margin-bottom: 8px;
        }

        .upload-hint {

            color: #777;

            font-size: 13px;
        }

        input[type="file"] {

            display: none;
        }

        #preview {

            max-width: 100%;

            max-height: 300px;

            border-radius: 15px;

            margin:
                20px auto;

            display: none;
        }

        button {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #d4af37,
                    #f0d77b
                );

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                0.2s ease;
        }

        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(
                    212,
                    175,
                    55,
                    0.25
                );
        }

        button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }

        #result {

            display: none;

            margin-top: 30px;

            padding: 25px;

            border-radius: 16px;

            background:
                rgba(
                    212,
                    175,
                    55,
                    0.06
                );

            border:
                1px solid
                rgba(
                    212,
                    175,
                    55,
                    0.25
                );
        }

        #prediction {

            color: #d4af37;

            font-size: 32px;

            font-weight: bold;

            margin:
                10px 0;
        }

        #confidence {

            color: #bbb;

        }

        #error {

            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            background:
                rgba(
                    180,
                    40,
                    40,
                    0.15
                );

            color: #ff9b9b;
        }

        .disclaimer {

            margin-top: 30px;

            color: #666;

            font-size: 12px;

            line-height: 1.5;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="logo">
        DERMAI
    </div>

    <h1>
        Skin Disease Detector
    </h1>

    <p class="subtitle">
        Upload a skin lesion image and our
        machine-learning model will analyze it.
    </p>


    <label
        class="upload-box"
        for="imageInput"
    >

        <div class="upload-icon">
            📷
        </div>

        <div class="upload-text">
            Click to upload an image
        </div>

        <div class="upload-hint">
            JPG, JPEG, PNG or WEBP
        </div>

    </label>


    <input
        type="file"
        id="imageInput"
        accept="image/png,image/jpeg,image/webp"
    >


    <img
        id="preview"
        alt="Image preview"
    >


    <button
        id="analyzeButton"
        disabled
    >
        Analyze Image
    </button>


    <div id="result">

        <div>
            Prediction
        </div>

        <div id="prediction">
            —
        </div>

        <div id="confidence">
            Confidence: —
        </div>

    </div>


    <div id="error"></div>


    <p class="disclaimer">

        ⚠️ This tool is for research and educational
        purposes only. It is not a medical diagnostic
        device and should not replace professional
        medical advice.

    </p>

</div>


<script>

    const imageInput =
        document.getElementById(
            "imageInput"
        );

    const preview =
        document.getElementById(
            "preview"
        );

    const analyzeButton =
        document.getElementById(
            "analyzeButton"
        );

    const result =
        document.getElementById(
            "result"
        );

    const prediction =
        document.getElementById(
            "prediction"
        );

    const confidence =
        document.getElementById(
            "confidence"
        );

    const errorBox =
        document.getElementById(
            "error"
        );


    imageInput.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file) {

                analyzeButton.disabled =
                    true;

                preview.style.display =
                    "none";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    preview.src =
                        event.target.result;

                    preview.style.display =
                        "block";

                };


            reader.readAsDataURL(file);


            analyzeButton.disabled =
                false;

            result.style.display =
                "none";

            errorBox.style.display =
                "none";

        }
    );


    analyzeButton.addEventListener(
        "click",
        async function () {

            const file =
                imageInput.files[0];

            if (!file) {
                return;
            }


            analyzeButton.disabled =
                true;

            analyzeButton.textContent =
                "Analyzing...";


            result.style.display =
                "none";

            errorBox.style.display =
                "none";


            const formData =
                new FormData();

            formData.append(
                "image",
                file
            );


            try {

                const response =
                    await fetch(
                        "/analyze",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const text =
                    await response.text();


                let data;


                try {

                    data =
                        JSON.parse(text);

                } catch (jsonError) {

                    throw new Error(
                        "The server returned an invalid response. Check the Render logs."
                    );

                }


                if (!response.ok) {

                    throw new Error(
                        data.details
                            ? `${data.error}: ${data.details}`
                            : data.error ||
                              "Analysis failed."
                    );

                }


                prediction.textContent =
                    data.prediction;


                confidence.textContent =
                    `Confidence: ${data.confidence}%`;


                result.style.display =
                    "block";


            } catch (error) {

                errorBox.textContent =
                    error.message;


                errorBox.style.display =
                    "block";

            }


            analyzeButton.disabled =
                false;

            analyzeButton.textContent =
                "Analyze Image";

        }
    );

</script>

</body>

</html>
